version: 0.2

phases:
  install:
    commands:
      - echo "Install Phase"

  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin <ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Build Started
      - docker build -t brain-task-app .
      - docker tag brain-task-app:latest <ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/brain-task-app:latest

  post_build:
    commands:
      - echo Push Image
      - docker push <ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/brain-task-app:latest

artifacts:
  files:
    - '**/*'