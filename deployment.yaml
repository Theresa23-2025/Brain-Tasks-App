apiVersion: apps/v1
kind: Deployment

metadata:
  name: brain-task-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: brain-task-app

  template:
    metadata:
      labels:
        app: brain-task-app

    spec:
      containers:
      - name: brain-task-app
        image: 095907291932.dkr.ecr.us-west-2.amazonaws.com/brain-task-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80